name: Build & Distribute APK

# Triggers:
#   - Every push to master (post-merge)
#   - Every push to any fix/* or feat/* branch (active development)
#   - Manual trigger from GitHub Actions tab (Actions → Build & Distribute APK → Run workflow)
on:
  push:
    branches:
      - master
      - 'fix/**'
      - 'feat/**'
  workflow_dispatch:

jobs:
  distribute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — versionCode is derived from commit count

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Compute version info
        # Same derivation as app/build.gradle.kts (commit count * 100_000 + run number,
        # short SHA) so the release note below matches exactly what Settings → About
        # shows on the phone — including the GITHUB_RUN_NUMBER tiebreaker that keeps
        # versionCode unique even when the same commit gets built twice (e.g. a
        # fast-forward merge triggers this workflow again on master right after it
        # already ran on the feature branch).
        run: |
          COUNT=$(git rev-list --count HEAD)
          echo "APP_VERSION_NAME=1.0.$COUNT" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$((COUNT * 100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "APP_GIT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Build debug APK
        # The shared debug.keystore is committed to the repo so the APK is
        # signed consistently — Android treats each CI build as an update, not a reinstall.
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload to Firebase App Distribution
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          RELEASE_NOTES: "${{ env.APP_VERSION_NAME }} (${{ env.APP_VERSION_CODE }}, ${{ env.APP_GIT_SHA }}) | Branch: ${{ github.ref_name }} | ${{ github.event.head_commit.message }}"
        run: |
          npm install -g firebase-tools
          echo "$FIREBASE_SA_JSON" > /tmp/sa.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json firebase appdistribution:distribute \
            app/build/outputs/apk/debug/app-debug.apk \
            --app "$FIREBASE_APP_ID" \
            --testers "chrisjmendoza@gmail.com" \
            --release-notes "$RELEASE_NOTES"
          rm /tmp/sa.json
