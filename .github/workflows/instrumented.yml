name: Instrumented Tests

# Triggers:
#   - Every push to master (post-merge) — the "on merge to main" job: exercises the
#     androidTest suite (DatabaseMigrationTest's full v1→v20 migration chain,
#     PostmarkDatabaseTest's in-memory Room DAO tests) that nobody can run locally
#     most days, since no physical device is attached to the dev machine.
#   - Manual trigger from GitHub Actions tab (Actions → Instrumented Tests → Run
#     workflow) — lets this workflow be validated from any branch before it's
#     trusted to gate master.
on:
  push:
    branches:
      - master
  workflow_dispatch:

# Cancel a superseded run (e.g. a second push to master while the first run's
# emulator boot is still in progress) rather than paying for two overlapping
# ~15-25 min emulator jobs.
concurrency:
  group: instrumented-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Enable KVM
        # Hosted GitHub runners ship /dev/kvm but the default udev rule leaves it
        # unreadable by the runner user — without this the emulator falls back to
        # (unusably slow) software virtualization. Standard boilerplate for
        # reactivecircus/android-emulator-runner on ubuntu-latest.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Upload instrumented test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: connected-test-reports
          path: |
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected
